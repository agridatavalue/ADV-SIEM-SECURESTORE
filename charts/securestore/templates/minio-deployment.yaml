apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "securestore.minioName" . }}
  labels:
    {{- include "securestore.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, so a new pod
  # cannot mount it while the outgoing pod still holds it. A rolling update
  # would deadlock with the new pod stuck in ContainerCreating.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "securestore.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "securestore.labels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            - server
            - "--console-address"
            - ":{{ .Values.minio.service.consolePort }}"
            - /data
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
              protocol: TCP
          env:
            # Credentials are never templated into the manifest; they are read
            # from the Secret named by minio.auth.existingSecret.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "securestore.authSecretName" . }}
                  key: {{ .Values.minio.auth.userKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "securestore.authSecretName" . }}
                  key: {{ .Values.minio.auth.passwordKey }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /data
          {{- with .Values.minio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: storage
        {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.minio.persistence.name }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.minio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
